applications:
  - name: django-app
    namespace: argocd
    project: default
    source:
      repoURL: https://github.com/filimon4uck/my-microservice-project.git
      path: final_project/charts/django-app
      targetRevision: final_project
      helm:
        valueFiles:
          - values.yaml
        parameters:
          - name: DATABASE_ENGINE
            value: postgresql
          - name: DATABASE_NAME
            value: mydb
          - name: DATABASE_USERNAME
            value: user
          - name: DATABASE_PASSWORD
            value: password
          - name: DATABASE_HOST
            value: db-host
          - name: DATABASE_PORT
            value: "5432"
    destination:
      server: https://kubernetes.default.svc
      namespace: argocd
    syncPolicy:
      automated:
        prune: true
        selfHeal: true



